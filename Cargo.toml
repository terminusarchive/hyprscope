[package]
name = "hyprscope"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "a TUI for viewing hyprland session internals: windows, monitors, events, log and config."
repository = "https://github.com/terminusarchive/hyprscope"
readme = "README.md"
keywords = ["hyprland", "tui", "wayland", "monitoring", "terminal"]
categories = ["command-line-utilities", "visualization"]
include = [
    "src/**",
    "tests/**",
    "docs/screenshot.svg",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "Cargo.lock",
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2.2"
