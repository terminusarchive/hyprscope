name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.toolchain == 'stable' && 'clippy' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test
      # Lint sets differ between compiler versions, so lint on stable only.
      - if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets -- -D warnings
